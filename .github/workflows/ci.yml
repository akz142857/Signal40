name: Signal 40 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signal40
          POSTGRES_PASSWORD: signal40
          POSTGRES_DB: signal40
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signal40 -d signal40"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://signal40:signal40@127.0.0.1:5432/signal40
      # 对象存储契约测试对着真实的 R2 测试桶跑。仓库没配这组 secret 时
      # S3_ENDPOINT 为空，那三个用例自动跳过，其余流水线照常。
      # 不用本地替身：分片、元数据、校验和的行为差异，替身测出来的结论不作数。
      S3_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      S3_REGION: auto
      S3_BUCKET: ${{ secrets.R2_TEST_BUCKET }}
      S3_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SIGNAL40_SOURCE_SCAN_CANARY: signal40-source-api-canary:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # runner 预装的 Google Chrome apt 源与 ffmpeg 无关，但它的索引校验失败
      # （Hash Sum mismatch）会让 apt-get update 整体非零退出，连带阻断安装——
      # 连续两次 run 因此在 npm ci 之前就红。先移除这个我们从不安装的第三方源，
      # 官方源的 update 与 ffmpeg 的 install 仍然是硬门禁，不吞失败。
      - name: Install media probe dependencies
        run: |
          # 按内容而不是文件名删：runner 上这个源可能是 .list 也可能是 deb822 的 .sources。
          sudo grep -rls 'dl\.google\.com' /etc/apt/sources.list.d/ | sudo xargs -r rm -v -f
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - name: Typecheck
        run: npm exec tsc -- --noEmit
      - run: npm run openapi:lint
      # 比对锚定的已发布 baseline，而不是「上一个提交」。用 github.event.before 会让
      # baseline 随每次推送漂移：真实的破坏性变更在下一个提交后就自动「消失」，
      # 而正常的 pre-GA schema 演进反而每次都硬失败。锚点见 §9.2 / P0A-API-04B。
      - name: Reject OpenAPI breaking changes against the anchored published baseline
        run: npm run openapi:breaking -- --baseline contracts/openapi.baseline.yaml --allowlist contracts/openapi.breaking-allowlist.yaml
      # 存储契约测试靠上面的 R2 secret 启用；没配就自动跳过。
      - run: npm test
      - name: Scan Actor DTO and redacted source artifacts for sensitive canary variants
        run: npm run source:sensitive-canary
      - run: npm run test:evaluation
      - run: npm run db:migrations:verify
      - run: npm run db:migrate
      # 再跑一次验证迁移是幂等的。
      - run: npm run db:migrate
      - run: npm run drill:restore
      - run: npm run build
      - run: npm run test:render

  workload-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: control
            dockerfile: Dockerfile
            image: signal40-control-plane:ci
            compose_image: signal40-control-plane:latest
            service: control-plane
          - profile: source
            dockerfile: source-worker/Dockerfile
            image: signal40-source-worker:ci
            compose_image: signal40-source-worker:latest
            service: source-worker
          - profile: render
            dockerfile: render-worker/Dockerfile
            image: signal40-render-worker:ci
            compose_image: signal40-render-worker:latest
            service: render-worker
    env:
      SIGNAL40_IMAGE_SCAN_CANARY: signal40-ci-canary-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Place ignored build-context canaries
        run: npm run image:canary:prepare
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ matrix.image }}
            ${{ matrix.compose_image }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
      - name: Verify non-root, production defaults, rootfs and all image layers
        run: npm run image:verify -- --image "${{ matrix.image }}" --profile "${{ matrix.profile }}"
      - name: Verify Compose runtime Secret visibility
        run: npm run compose:env:verify -- --service "${{ matrix.service }}" --profile "${{ matrix.profile }}"
      - name: Verify scheduler runtime Secret visibility
        if: matrix.profile == 'control'
        run: |
          docker tag "${{ matrix.image }}" signal40-scheduler:latest
          npm run compose:env:verify -- --service scheduler --profile scheduler
      - name: Scan image secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Scan fixable high/critical vulnerabilities and image misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          scanners: vuln,misconfig
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          hide-progress: true
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ matrix.image }}
          format: spdx-json
          artifact-name: signal40-${{ matrix.profile }}-${{ github.sha }}.spdx.json
          output-file: signal40-${{ matrix.profile }}.spdx.json
          upload-release-assets: false
      # 镜像里没有 npm 了，直接调 node。render-smoke.ts 和它依赖的 test/fixtures 是测试资产，
      # 不进生产镜像——只读挂进去跑，镜像自己的 lib/render-worker/video/node_modules 和
      # Chromium/FFmpeg 才是被冒烟的对象。
      - name: Render image smoke
        if: matrix.profile == 'render'
        run: |
          docker run --rm --shm-size=1g \
            -v "$PWD/scripts/render-smoke.ts:/app/scripts/render-smoke.ts:ro" \
            -v "$PWD/test/fixtures:/app/test/fixtures:ro" \
            --entrypoint node "${{ matrix.image }}" \
            --experimental-strip-types scripts/render-smoke.ts
      - name: Remove build-context canaries
        if: always()
        run: npm run image:canary:cleanup
