          type: string
          minLength: 3
          maxLength: 982
          pattern: '^[A-Za-z][A-Za-z0-9+.-]{1,80}:[^\s]{1,900}$'
          description: Opaque non-HTTP reference to the provisional evidence record
        note: { type: string, minLength: 10, maxLength: 1000 }
    SourceRightsRequestSubmissionResult:
      type: object
      additionalProperties: false
      required: [status, requestId, sourceVersion, replayed]
      properties:
        status: { type: integer, enum: [200, 201] }
        requestId: { type: string, minLength: 1 }
        sourceVersion: { type: integer, minimum: 1 }
        replayed: { type: boolean }
    SourceImportIssue:
