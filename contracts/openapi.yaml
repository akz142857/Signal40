      type: object
      additionalProperties: false
      required: [status, request, sourceVersion, replayed]
      properties:
        status: { type: integer, const: 200 }
        request: { $ref: '#/components/schemas/SourceRightsRequestRecord' }
        sourceVersion: { type: integer, minimum: 2 }
        rightsGrantId: { type: [string, 'null'] }
        replayed: { type: boolean }
