openapi: 3.1.0
info:
  title: Signal 40 Control Plane API
  version: 2.0.0
  description: Evidence-first finance video production control plane. All mutating project operations are authenticated, role checked, audited, and version or idempotency guarded.
servers:
  - url: /api/v1
security:
  - sitesSession: []
paths:
  /projects:
    get:
      summary: List content projects
      responses: { '200': { description: Project list } }
    post:
      summary: Create a project from an approved topic or a v2 contract
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'201': {description: Created}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /projects/{projectId}:
    get:
      summary: Read the current project and ETag
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {'200': {description: Project}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      summary: Update template, brand, locale, or channel configuration and invalidate stale production approval
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'200': {description: Updated}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
  /projects/{projectId}/transitions:
    post:
      summary: Apply one state-machine transition using server-computed gates. RENDERING and QC_PENDING are worker-only; PUBLISHED is written by the channel callback, except for the package channel where a publisher confirms manual distribution (requires a completed package publish job and a note of at least 10 characters).
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'200': {description: Transitioned}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}, '428': {$ref: '#/components/responses/PreconditionRequired'}}
  /projects/{projectId}/gates:
    get:
      summary: Evaluate G0-G8 from authoritative server data
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {'200': {description: Gate results}}
  /projects/{projectId}/audit:
    get:
      summary: Read the append-only project audit trail
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {'200': {description: Audit events}}
  /projects/{projectId}/research:
    get:
      summary: Read claim-level research
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      responses: {'200': {description: Research snapshot}}
    post:
      summary: Save an immutable research version and invalidate stale approval
      parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'200': {description: Saved}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /projects/{projectId}/scripts:
    get: {summary: List script versions, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Versions}}}
    post: {summary: Save immutable script version, parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Saved}, '409': {$ref: '#/components/responses/Conflict'}}}
  /projects/{projectId}/storyboards:
    get: {summary: List storyboard versions, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Versions}}}
    post: {summary: Save immutable contiguous storyboard, parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IfMatch'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Saved}, '409': {$ref: '#/components/responses/Conflict'}}}
  /projects/{projectId}/approvals:
    post:
      summary: Record research, script, QC, or publish approval bound to a subject hash
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'201': {description: Approved}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}
  /projects/{projectId}/assets:
    get: {summary: List R2 asset metadata, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Assets}}}
    post:
      summary: Upload a small asset directly (50 MB maximum)
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}}
      responses: {'201': {description: Uploaded}, '413': {description: Too large}}
  /projects/{projectId}/asset-uploads:
    post:
      summary: Create a 24-hour R2 multipart upload
      parameters: [{$ref: '#/components/parameters/ProjectId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'201': {description: Upload session}}
  /asset-uploads/{uploadId}/parts/{partNumber}:
    put:
      summary: Upload one multipart part (100 MB maximum)
      parameters:
        - {name: uploadId, in: path, required: true, schema: {type: string}}
        - {name: partNumber, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}}
      responses: {'200': {description: Part ETag}}
  /asset-uploads/{uploadId}/complete:
    post: {summary: Complete multipart upload and attach immutable input asset, parameters: [{name: uploadId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Asset}}}
  /asset-uploads/{uploadId}/abort:
    post: {summary: Abort an incomplete multipart upload and remove its temporary R2 parts, parameters: [{name: uploadId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Aborted}, '409': {$ref: '#/components/responses/Conflict'}}}
  /jobs:
    post:
      summary: Enqueue voice, low-bitrate preview, or final render work bound to the current immutable hash
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: {'202': {description: Queued}, '409': {$ref: '#/components/responses/Conflict'}}
  /jobs/lease:
    post: {summary: Lease an eligible job to an authenticated worker, security: [{workerToken: []}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Leased}, '204': {description: No work}}}
  /jobs/{jobId}/heartbeat:
    post: {summary: Renew the lease of a running job, security: [{workerToken: []}], parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Lease renewed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /jobs/{jobId}/finish:
    post: {summary: Complete or retry a leased job; terminal=true sends a non-retryable failure straight to the dead-letter queue, security: [{workerToken: []}], parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated}}}
  /jobs/{jobId}:
    get: {summary: Inspect one operational job, parameters: [{name: jobId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Job}}}
    patch: {summary: Cancel or replay a job with an audit note, parameters: [{name: jobId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /projects/{projectId}/voice-tracks:
    get: {summary: List generated voice and caption tracks, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Tracks}}}
    post: {summary: Commit TTS audio, provider alignment, and captions, security: [{workerToken: []}], parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Committed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /projects/{projectId}/qc-reports:
    get: {summary: List automatic QC reports, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Reports}}}
    post: {summary: Commit QC for a leased render job, security: [{workerToken: []}], parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Created}}}
  /projects/{projectId}/publish-jobs:
    get: {summary: List channel jobs, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Jobs}}}
    post: {summary: Create a package or YouTube publication after G7, parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'202': {description: Scheduled}, '409': {$ref: '#/components/responses/Conflict'}}}
  /publish-jobs/{publishJobId}/withdraw:
    post: {summary: Record a withdrawal incident and enqueue remote takedown, parameters: [{name: publishJobId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'202': {description: Withdrawal accepted}, '409': {$ref: '#/components/responses/Conflict'}}}
  /publish-jobs/{publishJobId}/complete:
    post: {summary: Commit a worker publication result and remote video identifier, security: [{workerToken: []}], parameters: [{name: publishJobId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Publication committed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /publish-jobs/{publishJobId}/package:
    get: {summary: Download the authenticated distribution package manifest, parameters: [{name: publishJobId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Package manifest}, '404': {$ref: '#/components/responses/NotFound'}}}
  /projects/{projectId}/metrics:
    get: {summary: Read post-publish metric snapshots, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Snapshots}}}
    post: {summary: Append attributed 2h/24h/7d metrics, parameters: [{$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Captured}}}
  /projects/{projectId}/incidents:
    get: {summary: List correction, fact-update, complaint, and withdrawal incidents, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Incidents}}}
    post: {summary: Open a correction, fact-update, or complaint incident, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Incident created}}}
  /incidents/{incidentId}:
    patch: {summary: Resolve a content incident with an audited resolution, parameters: [{name: incidentId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Resolved}}}
  /source-configs:
    get: {summary: List source configurations and health, responses: {'200': {description: Sources}}}
    post: {summary: Register an authorized source, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Source}}}
  /source-configs/{sourceId}:
    get: {summary: Read one source configuration and recent health, parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Source}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {summary: Version-guard a source schedule, rights status, configuration, or enabled state, parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /source-configs/{sourceId}/runs:
    get: {summary: List ingestion runs, parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Runs}}}
    post: {summary: Trigger ingestion, parameters: [{name: sourceId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'202': {description: Queued}}}
  /scheduler/run:
    post: {summary: Run one bounded orchestration tick manually (the resident scheduler process runs the same engine), security: [{schedulerToken: []}], responses: {'200': {description: Automation tick result}}}
  /projects/{projectId}/automation:
    post: {summary: Pause or resume automation for one project with an audited reason, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated project}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /automation/policies:
    get: {summary: List automation policies and the default policy shape, responses: {'200': {description: Policies}}}
    post: {summary: Create an automation policy (dual authorizers must be distinct active members), requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Policy}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /automation/policies/{policyId}:
    get: {summary: Read one automation policy, parameters: [{name: policyId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Policy}, '404': {$ref: '#/components/responses/NotFound'}}}
    patch: {summary: Update stages, pre-authorization, guardrails, or the enabled switch, parameters: [{name: policyId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Policy}, '422': {$ref: '#/components/responses/ValidationError'}}}
    delete: {summary: Delete a policy and return its projects to manual, parameters: [{name: policyId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}}}
  /automation/runs:
    get: {summary: List recent orchestration ticks with actions, errors, and breaker state, responses: {'200': {description: Runs}}}
  /attention:
    get: {summary: List inbox items that need a human, responses: {'200': {description: Attention items}}}
  /attention/{attentionId}:
    patch: {summary: Resolve one inbox item with an audited note, parameters: [{name: attentionId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Resolved}, '404': {$ref: '#/components/responses/NotFound'}}}
  /workers:
    get: {summary: List worker heartbeats, queue backlog, and jobs no online worker can execute, responses: {'200': {description: Worker and queue state}}}
    post: {summary: Report a worker heartbeat (sent while idle too), security: [{workerToken: []}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Recorded}, '401': {description: Unauthorized}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /diagnostics:
    get: {summary: Self-check database, migrations, object storage, credentials, workers, queue, and last scheduler tick without echoing secrets, responses: {'200': {description: Diagnostics}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /session:
    get: {summary: Read the identity the server resolved for this request, responses: {'200': {description: Session actor}, '401': {description: No identity resolved}}}
  /operations:
    get: {summary: Read 30-day job, QC, ingestion, incident, latency, retry, DLQ, and cost indicators, responses: {'200': {description: Operational indicators}}}
  /health:
    get: {summary: Check D1 and queue health, security: [], responses: {'200': {description: Healthy or degraded}, '503': {description: Unhealthy}}}
  /media:
    get:
      summary: Stream an R2 asset using a session, worker token, or short-lived object signature
      parameters:
        - {name: objectKey, in: query, required: true, schema: {type: string}}
        - {name: expires, in: query, required: false, schema: {type: integer}}
        - {name: signature, in: query, required: false, schema: {type: string}}
      responses: {'200': {description: Media object}, '403': {$ref: '#/components/responses/Forbidden'}, '404': {$ref: '#/components/responses/NotFound'}}
  /media-tokens:
    post: {summary: Mint a 30 to 900 second object-level media URL for an authenticated team member, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Signed media URL}, '404': {$ref: '#/components/responses/NotFound'}, '503': {description: Signing secret missing}}}
  /contracts/migrate:
    post: {summary: Validate and migrate one v1 project contract to v2 without persistence, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Migrated contract}, '422': {$ref: '#/components/responses/ValidationError'}}}
  /contracts/rehash:
    post: {summary: Migrate legacy project fingerprints to SHA-256 and invalidate downstream approvals, responses: {'200': {description: Migration result}}}
  /ingestion-runs/{ingestionRunId}/commit:
    post: {summary: Atomically commit normalized ingestion records, revisions, clustering, checkpoint, and run outcome, security: [{workerToken: []}], parameters: [{name: ingestionRunId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Ingestion committed}, '409': {$ref: '#/components/responses/Conflict'}}}
  /ingestion-runs/{ingestionRunId}/raw:
    put: {summary: Store an authorized raw source payload with object-level retention metadata, security: [{workerToken: []}], parameters: [{name: ingestionRunId, in: path, required: true, schema: {type: string}}], requestBody: {required: true, content: {application/octet-stream: {schema: {type: string, contentEncoding: binary}}}}, responses: {'201': {description: Raw payload stored}, '409': {$ref: '#/components/responses/Conflict'}, '413': {description: Too large}}}
  /webhooks/youtube:
    post: {summary: Receive HMAC-signed replay-protected YouTube status callbacks, security: [{webhookSignature: []}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'202': {description: Processed}, '401': {description: Invalid signature}}}
  /team-members:
    get: {summary: List server-authoritative memberships, responses: {'200': {description: Members}}}
    post: {summary: Add a member, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Created}}}
  /team-members/{userId}:
    patch: {summary: Change an existing member role or status, parameters: [{name: userId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated}, '404': {$ref: '#/components/responses/NotFound'}}}
  /experiments:
    get: {summary: List controlled content experiments, responses: {'200': {description: Experiments}}}
    post: {summary: Create an experiment with deterministic allocation, parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Experiment}}}
  /experiments/{experimentId}:
    patch: {summary: Start, complete, or cancel an experiment, parameters: [{name: experimentId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Updated}, '409': {$ref: '#/components/responses/Conflict'}}}
  /projects/{projectId}/experiment-assignments:
    get: {summary: List immutable experiment assignments, parameters: [{$ref: '#/components/parameters/ProjectId'}], responses: {'200': {description: Assignments}}}
    post: {summary: Deterministically assign a project to a running experiment, parameters: [{$ref: '#/components/parameters/ProjectId'}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Assignment}}}
  /calibration-runs:
    get: {summary: List offline score calibration evidence, responses: {'200': {description: Calibration runs}}}
    post: {summary: Register a candidate calibration from at least 100 labelled cases, requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'201': {description: Candidate}}}
  /calibration-runs/{calibrationId}/decision:
    post: {summary: Independently approve or reject calibration evidence, parameters: [{name: calibrationId, in: path, required: true, schema: {type: string}}], requestBody: {$ref: '#/components/requestBodies/JsonBody'}, responses: {'200': {description: Decision}}}
components:
  securitySchemes:
    sitesSession: {type: apiKey, in: cookie, name: sites_session}
    workerToken: {type: apiKey, in: header, name: X-Worker-Token}
    schedulerToken: {type: apiKey, in: header, name: X-Worker-Token}
    webhookSignature: {type: apiKey, in: header, name: X-Signal-Signature}
  parameters:
    ProjectId: {name: projectId, in: path, required: true, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^(W/)?"[0-9]+"$'}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 160}}
  requestBodies:
    JsonBody: {required: true, content: {application/json: {schema: {type: object}}}}
  responses:
    Forbidden: {description: Authenticated user lacks an active membership or role}
    NotFound: {description: Resource not found}
    Conflict: {description: State, gate, hash, lease, or ETag conflict}
    ValidationError: {description: Invalid request payload}
    PreconditionRequired: {description: If-Match is required}
