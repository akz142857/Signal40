         credential_ref, credential_version, rate_limit_per_minute,
         retention_mode, retention_days, config]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        adapter: { type: string, enum: [rss, http] }
        platform: { type: string, enum: [rss, http_json] }
        enabled: { type: boolean }
        rights_status: { $ref: '#/components/schemas/SourceRightsStatus' }
