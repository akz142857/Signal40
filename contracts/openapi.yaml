      type: object
      additionalProperties: false
      required: [sourceId, replayed]
      properties:
        sourceId: { type: string, minLength: 1 }
        replayed: { type: boolean, const: true }
        rightsRequestId: { type: [string, 'null'], maxLength: 200 }
