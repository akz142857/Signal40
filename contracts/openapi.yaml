openapi: 3.1.0
info:
  title: Signal 40 Control Plane API
  version: 2.0.0
  description: Evidence-first finance video production control plane. All mutating project operations are authenticated, role checked, audited, and version or idempotency guarded.
servers:
  - url: /api/v1
security:
  - sitesSession: []
paths:
  /projects:
    get:
      summary: List content projects
      responses: { '200': { description: Project list } }
    post:
      summary: Create a project from an approved topic or a v2 contract
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '201': { description: Created },
          '409': { $ref: '#/components/responses/Conflict' },
          '422': { $ref: '#/components/responses/ValidationError' },
        }
  /projects/{projectId}:
    get:
      summary: Read the current project and ETag
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses:
        {
          '200': { description: Project },
          '404': { $ref: '#/components/responses/NotFound' },
        }
    patch:
      summary: Update template, brand, locale, or channel configuration and invalidate stale production approval
      parameters:
        [
          { $ref: '#/components/parameters/ProjectId' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '200': { description: Updated },
          '403': { $ref: '#/components/responses/Forbidden' },
          '409': { $ref: '#/components/responses/Conflict' },
          '422': { $ref: '#/components/responses/ValidationError' },
          '428': { $ref: '#/components/responses/PreconditionRequired' },
        }
  /projects/{projectId}/transitions:
    post:
      summary: Apply one state-machine transition using server-computed gates. RENDERING and QC_PENDING are worker-only; PUBLISHED is written by the channel callback, except for the package channel where a publisher confirms manual distribution (requires a completed package publish job and a note of at least 10 characters).
      parameters:
        [
          { $ref: '#/components/parameters/ProjectId' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '200': { description: Transitioned },
          '403': { $ref: '#/components/responses/Forbidden' },
          '409': { $ref: '#/components/responses/Conflict' },
          '428': { $ref: '#/components/responses/PreconditionRequired' },
        }
  /projects/{projectId}/gates:
    get:
      summary: Evaluate G0-G8 from authoritative server data
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Gate results } }
  /projects/{projectId}/audit:
    get:
      summary: Read the append-only project audit trail
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Audit events } }
  /projects/{projectId}/research:
    get:
      summary: Read claim-level research
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      responses: { '200': { description: Research snapshot } }
    post:
      summary: Save an immutable research version and invalidate stale approval
      parameters:
        [
          { $ref: '#/components/parameters/ProjectId' },
          { $ref: '#/components/parameters/IfMatch' },
        ]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '200': { description: Saved },
          '409': { $ref: '#/components/responses/Conflict' },
          '422': { $ref: '#/components/responses/ValidationError' },
        }
  /projects/{projectId}/scripts:
    get:
      {
        summary: List script versions,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Versions } },
      }
    post:
      {
        summary: Save immutable script version,
        parameters:
          [
            { $ref: '#/components/parameters/ProjectId' },
            { $ref: '#/components/parameters/IfMatch' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '200': { description: Saved },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /projects/{projectId}/storyboards:
    get:
      {
        summary: List storyboard versions,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Versions } },
      }
    post:
      {
        summary: Save immutable contiguous storyboard,
        parameters:
          [
            { $ref: '#/components/parameters/ProjectId' },
            { $ref: '#/components/parameters/IfMatch' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '200': { description: Saved },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /projects/{projectId}/approvals:
    post:
      summary: Record research, script, QC, or publish approval bound to a subject hash
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '201': { description: Approved },
          '403': { $ref: '#/components/responses/Forbidden' },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /projects/{projectId}/assets:
    get:
      {
        summary: List R2 asset metadata,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Assets } },
      }
    post:
      summary: Upload a small asset directly (50 MB maximum)
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody:
        {
          required: true,
          content:
            {
              application/octet-stream:
                { schema: { type: string, contentEncoding: binary } },
            },
        }
      responses:
        { '201': { description: Uploaded }, '413': { description: Too large } }
  /projects/{projectId}/asset-uploads:
    post:
      summary: Create a 24-hour R2 multipart upload
      parameters: [{ $ref: '#/components/parameters/ProjectId' }]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses: { '201': { description: Upload session } }
  /asset-uploads/{uploadId}/parts/{partNumber}:
    put:
      summary: Upload one multipart part (100 MB maximum)
      parameters:
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - {
            name: partNumber,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          }
      requestBody:
        {
          required: true,
          content:
            {
              application/octet-stream:
                { schema: { type: string, contentEncoding: binary } },
            },
        }
      responses: { '200': { description: Part ETag } }
  /asset-uploads/{uploadId}/complete:
    post:
      {
        summary: Complete multipart upload and attach immutable input asset,
        parameters:
          [
            {
              name: uploadId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '201': { description: Asset } },
      }
  /asset-uploads/{uploadId}/abort:
    post:
      {
        summary: Abort an incomplete multipart upload and remove its temporary R2 parts,
        parameters:
          [
            {
              name: uploadId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            '200': { description: Aborted },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /jobs:
    post:
      summary: Enqueue voice, low-bitrate preview, or final render work bound to the current immutable hash
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { $ref: '#/components/requestBodies/JsonBody' }
      responses:
        {
          '202': { description: Queued },
          '409': { $ref: '#/components/responses/Conflict' },
        }
  /jobs/lease:
    post:
      {
        summary: Lease an eligible job to a service-scoped worker,
        security:
          [
            { sourceWorkerToken: [] },
            { renderWorkerToken: [] },
            { workerToken: [] },
          ],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/JobLeaseRequest' } },
              },
          },
        responses:
          { '200': { description: Leased }, '204': { description: No work } },
      }
  /jobs/{jobId}/heartbeat:
    post:
      {
        summary: Renew the lease of a running job using the token scope implied by its kind,
        security:
          [
            { sourceWorkerToken: [] },
            { renderWorkerToken: [] },
            { workerToken: [] },
          ],
        parameters:
          [{ name: jobId, in: path, required: true, schema: { type: string } }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/JobLeaseHeartbeat' } },
              },
          },
        responses:
          {
            '200': { description: Lease renewed },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /jobs/{jobId}/finish:
    post:
      {
        summary: "Complete or retry a scoped leased job; retryable failures may carry errorCode and retryDelaySeconds derived from Retry-After, while terminal=true sends a non-retryable failure straight to the dead-letter queue",
        security:
          [
            { sourceWorkerToken: [] },
            { renderWorkerToken: [] },
            { workerToken: [] },
          ],
        parameters:
          [{ name: jobId, in: path, required: true, schema: { type: string } }],
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/JobLeaseFinish' } },
              },
          },
        responses: { '200': { description: Updated } },
      }
  /jobs/{jobId}:
    get:
      {
        summary: Inspect one operational job,
        parameters:
          [{ name: jobId, in: path, required: true, schema: { type: string } }],
        responses: { '200': { description: Job } },
      }
    patch:
      {
        summary: Cancel or replay a job with an audit note,
        parameters:
          [
            { name: jobId, in: path, required: true, schema: { type: string } },
            { $ref: '#/components/parameters/IdempotencyKey' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '200': { description: Updated },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /projects/{projectId}/voice-tracks:
    get:
      {
        summary: List generated voice and caption tracks,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Tracks } },
      }
    post:
      {
        summary: "Commit TTS audio, provider alignment, and captions",
        security: [{ renderWorkerToken: [] }],
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '200': { description: Committed },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /projects/{projectId}/qc-reports:
    get:
      {
        summary: List automatic QC reports,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Reports } },
      }
    post:
      {
        summary: Commit QC for a leased render job,
        security: [{ renderWorkerToken: [] }],
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '201': { description: Created } },
      }
  /projects/{projectId}/publish-jobs:
    get:
      {
        summary: List channel jobs,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Jobs } },
      }
    post:
      {
        summary: Create a package or YouTube publication after G7,
        parameters:
          [
            { $ref: '#/components/parameters/ProjectId' },
            { $ref: '#/components/parameters/IdempotencyKey' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '202': { description: Scheduled },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /publish-jobs/{publishJobId}/withdraw:
    post:
      {
        summary: Record a withdrawal incident and enqueue remote takedown,
        parameters:
          [
            {
              name: publishJobId,
              in: path,
              required: true,
              schema: { type: string },
            },
            { $ref: '#/components/parameters/IdempotencyKey' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '202': { description: Withdrawal accepted },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /publish-jobs/{publishJobId}/complete:
    post:
      {
        summary: Commit a worker publication result and remote video identifier,
        security: [{ renderWorkerToken: [] }],
        parameters:
          [
            {
              name: publishJobId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses:
          {
            '200': { description: Publication committed },
            '409': { $ref: '#/components/responses/Conflict' },
          },
      }
  /publish-jobs/{publishJobId}/package:
    get:
      {
        summary: Download the authenticated distribution package manifest,
        parameters:
          [
            {
              name: publishJobId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            '200': { description: Package manifest },
            '404': { $ref: '#/components/responses/NotFound' },
          },
      }
  /projects/{projectId}/metrics:
    get:
      {
        summary: Read post-publish metric snapshots,
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Snapshots } },
      }
    post:
      {
        summary: Append attributed 2h/24h/7d metrics,
        parameters:
          [
            { $ref: '#/components/parameters/ProjectId' },
            { $ref: '#/components/parameters/IdempotencyKey' },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '201': { description: Captured } },
      }
  /projects/{projectId}/incidents:
    get:
      {
        summary: "List correction, fact-update, complaint, and withdrawal incidents",
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        responses: { '200': { description: Incidents } },
      }
    post:
      {
        summary: "Open a correction, fact-update, or complaint incident",
        parameters: [{ $ref: '#/components/parameters/ProjectId' }],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '201': { description: Incident created } },
      }
  /incidents/{incidentId}:
    patch:
      {
        summary: Resolve a content incident with an audited resolution,
        parameters:
          [
            {
              name: incidentId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '200': { description: Resolved } },
      }
  /source-proposals:
    get:
      summary: List the caller's proposals, or all proposals for admin and auditor
      x-source-action: source.proposal.read
      responses:
        '200':
          description: Source proposals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceProposalCollection' }
        '403': { $ref: '#/components/responses/SourceForbidden' }
    post:
      summary: Submit a source proposal without creating or approving a source
      x-source-action: source.proposal.create
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceProposalCreate' }
      responses:
        '200':
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceProposalEnvelope' }
        '201':
          description: Proposal created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceProposalEnvelope' }
        '400': { $ref: '#/components/responses/SourceBadRequest' }
        '403': { $ref: '#/components/responses/SourceForbidden' }
        '409': { $ref: '#/components/responses/SourceConflict' }
        '422': { $ref: '#/components/responses/SourceValidationError' }
  /source-proposals/{proposalId}/decision:
    post:
      summary: Approve or reject another actor's pending proposal
      x-source-action: source.proposal.decide
      parameters:
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceProposalDecision' }
      responses:
        '200':
          description: Proposal decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceProposalEnvelope' }
        '400': { $ref: '#/components/responses/SourceBadRequest' }
        '403': { $ref: '#/components/responses/SourceForbidden' }
        '404': { $ref: '#/components/responses/SourceNotFound' }
        '409': { $ref: '#/components/responses/SourceConflict' }
        '422': { $ref: '#/components/responses/SourceValidationError' }
  /source-configs:
    get:
      summary: List source configurations, health, ownership/steward assignments, trigger quota, and explicit per-request/monthly budget policy
      x-source-action: source.read
      responses:
        '200':
          description: Sources
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceConfigCollection' }
        '403': { $ref: '#/components/responses/SourceForbidden' }
    post:
      {
        x-source-action: source.create,
        summary: "Persist a disabled rights=pending draft, provisional rights request, active ownership assignments, and validated cost/budget policy; a separate capable actor must verify the grant",
        parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceConfigCreate' } } } },
        responses:
          {
            '200':
              {
                description: Idempotent replay,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceCreateReplay' } } },
              },
            '201':
              {
                description: Draft source,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceConfigMutationEnvelope' } } },
              },
            '400': { $ref: '#/components/responses/SourceBadRequest' },
            '403': { $ref: '#/components/responses/SourceForbidden' },
            '409': { $ref: '#/components/responses/SourceConflict' },
            '422': { $ref: '#/components/responses/SourceValidationError' },
          },
      }
  /source-configs/imports:
    post:
      {
        x-source-action: source.create,
        summary: "Preview OPML, source CSV, JSON, or newline URLs with row-level issues, or idempotently create individually asserted rights=pending drafts without bypassing independent rights, test, and enable gates",
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceImportRequest' } } } },
        responses:
          {
            '200':
              {
                description: Import preview,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceImportPreviewResult' } } },
              },
            '201':
              {
                description: Draft sources created,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceImportCommitResult' } } },
              },
            '400': { $ref: '#/components/responses/SourceBadRequest' },
            '403': { $ref: '#/components/responses/SourceForbidden' },
            '409': { $ref: '#/components/responses/SourceConflict' },
            '422': { $ref: '#/components/responses/SourceValidationError' },
            '425': { $ref: '#/components/responses/SourceTooEarly' },
            '503': { $ref: '#/components/responses/SourceUnavailable' },
          },
      }
  /source-connectors:
    get:
      {
        x-source-action: source.read,
        summary: "List server-authoritative connector availability, runtime rollout mode, capabilities, authentication mode, and minimum interval",
        responses:
          {
            '200':
              {
                description: Connector registry,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceConnectorCollection' } } },
              },
            '403': { $ref: '#/components/responses/SourceForbidden' },
          },
      }
  /source-credentials/policies:
    get:
      summary: List browser-safe credential aliases and their target/header allowlists without provider lookup names, prefixes, or Secret material
      x-source-action: source.governance.read
      responses:
        {
          '200':
            {
              description: Redacted credential policies,
              content: { application/json: { schema: { $ref: '#/components/schemas/SourceCredentialPolicyCollection' } } },
            },
          '403': { $ref: '#/components/responses/SourceForbidden' },
          '503': { $ref: '#/components/responses/SourceUnavailable' },
        }
  /source-connectors/{connectorId}/versions/{connectorVersion}/control:
    get:
      summary: Read one persistent connector-version rollout control
      x-source-action: source.governance.read
      parameters:
        - {
            name: connectorId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: connectorVersion,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        {
          '200':
            {
              description: Connector release control,
              content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorReleaseControlEnvelope' } } },
            },
          '403': { $ref: '#/components/responses/SourceForbidden' },
          '404': { $ref: '#/components/responses/SourceNotFound' },
        }
    patch:
      summary: Switch a connector version between disabled, shadow, and enabled, optionally enabling stable source-level canary selection and automatic failure-rate stop
      x-source-action: connector.release.manage
      parameters:
        - {
            name: connectorId,
            in: path,
            required: true,
            schema: { type: string },
          }
        - {
            name: connectorVersion,
            in: path,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: '#/components/schemas/ConnectorReleaseControlUpdate' }
      responses:
        {
          '200':
            {
              description: Rollout control updated,
              content: { application/json: { schema: { $ref: '#/components/schemas/ConnectorReleaseControlUpdateResult' } } },
            },
          '400': { $ref: '#/components/responses/SourceBadRequest' },
          '403': { $ref: '#/components/responses/SourceForbidden' },
          '404': { $ref: '#/components/responses/SourceNotFound' },
          '409': { $ref: '#/components/responses/SourceConflict' },
          '422': { $ref: '#/components/responses/SourceValidationError' },
        }
  /source-configs/{sourceId}:
    get:
      {
        x-source-action: source.read,
        summary: Read one source configuration and recent health,
        parameters:
          [
            {
              name: sourceId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        responses:
          {
            '200':
              {
                description: Source,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceConfigEnvelope' } } },
              },
            '403': { $ref: '#/components/responses/SourceForbidden' },
            '404': { $ref: '#/components/responses/SourceNotFound' },
          },
      }
    patch:
      {
        x-source-action: source.update,
        summary: "Version-guard a source configuration, schedule, cost/budget policy change, or pause; identity/mapping changes invalidate prior tests and direct enable is forbidden",
        parameters:
          [
            {
              name: sourceId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceConfigUpdate' } } } },
        responses:
          {
            '200':
              {
                description: Updated or paused,
                content: { application/json: { schema: { $ref: '#/components/schemas/SourceConfigMutationEnvelope' } } },
              },
            '400': { $ref: '#/components/responses/SourceBadRequest' },
            '403': { $ref: '#/components/responses/SourceForbidden' },
            '404': { $ref: '#/components/responses/SourceNotFound' },
            '409': { $ref: '#/components/responses/SourceConflict' },
            '422': { $ref: '#/components/responses/SourceValidationError' },
          },
