        retryAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
        sourceId: { type: string, minLength: 1 }
    SourceValidationIssue:
      type: object
      additionalProperties: false
      required: [index, issue]
      properties:
        index: { type: integer, minimum: 0 }
        issue: { type: string, minLength: 1, maxLength: 1000 }
    SourceConfigRecord:
      type: object
      additionalProperties: false
      required:
        [id, name, adapter, platform, lifecycleStatus, healthStatus,
         rightsStatus, enabled, version, ownerTeamId, businessOwnerId,
         credentialStewardId, backupAdminId, hasCredential,
         credentialVersion, scheduleCron, checkpointVersion, nextRunAt,
         lastSuccessAt, lastTestedAt, publicErrorCode, publicErrorMessage,
         consecutiveFailures, hasActiveRun, deletionStatus,
         deletionRequestId, rateLimitPerMinute, costMicrosPerRequest,
         pendingRightsRequestId, pendingRightsRequestedBy,
         estimatedRequestsPerRun, monthlyBudgetMicros,
         budgetSoftLimitPercent, schedulePriority, autoThrottleEnabled,
         effectiveScheduleMultiplier, scheduleThrottleReason,
         scheduleThrottleRecoveryAt, retention, publicConfig, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        adapter: { type: string, enum: [rss, http] }
        platform:
          { type: string, enum: [rss, http_json] }
        lifecycleStatus: { $ref: '#/components/schemas/SourceLifecycleStatus' }
        healthStatus: { $ref: '#/components/schemas/SourceHealthStatus' }
        rightsStatus: { $ref: '#/components/schemas/SourceRightsStatus' }
        enabled: { type: boolean }
        version: { type: integer, minimum: 1 }
        ownerTeamId: { type: [string, 'null'], maxLength: 200 }
        businessOwnerId: { type: [string, 'null'], maxLength: 200 }
        credentialStewardId: { type: [string, 'null'], maxLength: 200 }
        backupAdminId: { type: [string, 'null'], maxLength: 200 }
        hasCredential: { type: boolean }
        credentialVersion: { type: integer, minimum: 0 }
        scheduleCron: { type: [string, 'null'], maxLength: 200 }
        checkpointVersion: { type: integer, minimum: 0 }
        nextRunAt: { type: [string, 'null'], format: date-time }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastTestedAt: { type: [string, 'null'], format: date-time }
        publicErrorCode: { oneOf: [{ $ref: '#/components/schemas/SourceErrorCode' }, { type: 'null' }] }
        publicErrorMessage: { type: [string, 'null'], maxLength: 500 }
        consecutiveFailures: { type: integer, minimum: 0 }
        hasActiveRun: { type: boolean }
        deletionStatus:
          { type: [string, 'null'], enum: [pending, blocked, deleting, awaiting_external, failed, null] }
        deletionRequestId: { type: [string, 'null'], maxLength: 200 }
        pendingRightsRequestId: { type: [string, 'null'], maxLength: 200 }
        pendingRightsRequestedBy: { type: [string, 'null'], maxLength: 200 }
        rateLimitPerMinute: { type: integer, minimum: 1, maximum: 600 }
        costMicrosPerRequest: { type: integer, minimum: 0 }
        estimatedRequestsPerRun: { type: integer, minimum: 1 }
        monthlyBudgetMicros: { type: integer, minimum: 0 }
        budgetSoftLimitPercent: { type: integer, minimum: 0, maximum: 100 }
        schedulePriority: { type: integer, minimum: 0, maximum: 100 }
        autoThrottleEnabled: { type: boolean }
