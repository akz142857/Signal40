      properties:
        id: { type: string, minLength: 1 }
        sourceConfigId: { type: string, minLength: 1 }
        requestedBy: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/SourceRightsRequestStatus' }
        assertionRef: { type: string, minLength: 1, maxLength: 500 }
        sourceVersion: { type: integer, minimum: 1 }
        decision: { type: [string, 'null'], enum: [approve, reject, null] }
        decisionNote: { type: [string, 'null'], maxLength: 1000 }
        dossierHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        decidedBy: { type: [string, 'null'], maxLength: 200 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    SourceRightsRequestCollection:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        requests:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/SourceRightsRequestRecord' }
    SourceRightsDossier:
      type: object
      additionalProperties: false
      required:
        [principal, sourceType, permittedFields, territory, evidenceRef, evidenceSha256,
         termsVersion, termsSnapshotSha256, grantedAt, expiresAt]
      properties:
        principal: { type: string, minLength: 1, maxLength: 300 }
        sourceType: { type: string, enum: [social, media, market, filing, company] }
        permittedFields:
          type: array
          minItems: 3
          uniqueItems: true
          items: { type: string, enum: [id, title, summary, url, publishedAt, updatedAt, author, kind, deletedAt] }
        territory: { type: string, minLength: 1, maxLength: 200 }
        evidenceRef: { type: string, minLength: 1, maxLength: 1000 }
        evidenceSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        termsVersion: { type: string, minLength: 1, maxLength: 200 }
        termsSnapshotSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        grantedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    SourceRightsDecision:
      oneOf:
        - type: object
          additionalProperties: false
          required: [requestId, expectedSourceVersion, decision, note, dossier]
          properties:
            requestId: { type: string, minLength: 1 }
            expectedSourceVersion: { type: integer, minimum: 1 }
            decision: { type: string, const: approve }
            note: { type: string, minLength: 10, maxLength: 1000 }
            dossier: { $ref: '#/components/schemas/SourceRightsDossier' }
        - type: object
          additionalProperties: false
          required: [requestId, expectedSourceVersion, decision, note]
          properties:
            requestId: { type: string, minLength: 1 }
            expectedSourceVersion: { type: integer, minimum: 1 }
            decision: { type: string, const: reject }
            note: { type: string, minLength: 10, maxLength: 1000 }
