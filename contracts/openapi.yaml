        responses: { '201': { description: Assignment } },
      }
  /calibration-runs:
    get:
      {
        summary: List offline score calibration evidence,
        responses: { '200': { description: Calibration runs } },
      }
    post:
      {
        summary: Register a candidate calibration from at least 100 labelled cases,
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '201': { description: Candidate } },
      }
  /calibration-runs/{calibrationId}/decision:
    post:
      {
        summary: Independently approve or reject calibration evidence,
        parameters:
          [
            {
              name: calibrationId,
              in: path,
              required: true,
              schema: { type: string },
            },
          ],
        requestBody: { $ref: '#/components/requestBodies/JsonBody' },
        responses: { '200': { description: Decision } },
      }
components:
  securitySchemes:
    sitesSession: { type: apiKey, in: cookie, name: sites_session }
    workerToken: { type: apiKey, in: header, name: X-Worker-Token }
    sourceWorkerToken: { type: apiKey, in: header, name: X-Worker-Token }
    renderWorkerToken: { type: apiKey, in: header, name: X-Worker-Token }
    schedulerToken: { type: apiKey, in: header, name: X-Worker-Token }
    webhookSignature: { type: apiKey, in: header, name: X-Signal-Signature }
  parameters:
    ProjectId:
      { name: projectId, in: path, required: true, schema: { type: string } }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string, pattern: '^(W/)?"[0-9]+"$' },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, maxLength: 160 },
      }
  requestBodies:
    JsonBody:
      {
        required: true,
        content: { application/json: { schema: { type: object } } },
      }
  schemas:
    TeamRole:
      type: string
      enum: [researcher, editor, producer, publisher, auditor, admin]
    TeamMemberCreate:
      type: object
      additionalProperties: false
      required: [userId, email, role]
      properties:
        userId: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email, maxLength: 320 }
        role: { $ref: '#/components/schemas/TeamRole' }
        canApproveSourceRights: { type: boolean, default: false }
        canManageSourceLegal:
          {
            type: boolean,
            default: false,
            description: Admin-only capability for legal deletion and legal hold operations,
          }
    TeamMemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/TeamRole' }
        status: { type: string, enum: [active, suspended] }
        canApproveSourceRights: { type: boolean }
        canManageSourceLegal:
          {
            type: boolean,
            description: Admin-only capability; active holds retain at least two active operators,
          }
    TeamMemberListItem:
      type: object
      additionalProperties: false
      required:
        [user_id, email, role, status, can_approve_source_rights,
         can_manage_source_legal, created_at, updated_at,
         business_source_count, credential_source_count, backup_source_count]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        status: { type: string, enum: [active, suspended] }
        can_approve_source_rights: { type: integer, enum: [0, 1] }
        can_manage_source_legal: { type: integer, enum: [0, 1] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        business_source_count: { type: integer, minimum: 0 }
        credential_source_count: { type: integer, minimum: 0 }
        backup_source_count: { type: integer, minimum: 0 }
    TeamMemberCollection:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMemberListItem' }
    TeamMemberMutation:
      type: object
      additionalProperties: false
      required:
        [userId, email, role, status, canApproveSourceRights,
         canManageSourceLegal]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/TeamRole' }
        status: { type: string, enum: [active, suspended] }
        canApproveSourceRights: { type: boolean }
        canManageSourceLegal: { type: boolean }
    OwnershipReconciliation:
      type: object
      additionalProperties: false
      required: [checked, issueCount, resolvedCount, truncated]
      properties:
        checked: { type: integer, minimum: 0, maximum: 500 }
        issueCount: { type: integer, minimum: 0, maximum: 500 }
        resolvedCount: { type: integer, minimum: 0 }
        truncated: { type: boolean }
    TeamMemberMutationResult:
      type: object
      additionalProperties: false
      required: [member]
      properties:
        member: { $ref: '#/components/schemas/TeamMemberMutation' }
        ownershipImpact: { $ref: '#/components/schemas/OwnershipReconciliation' }
        replayed: { type: boolean }
    SourceErrorCode:
      type: string
      enum:
        [UNAUTHORIZED, FORBIDDEN, BAD_JSON, VALIDATION_ERROR, NOT_FOUND,
         VERSION_CONFLICT, STATE_CONFLICT, IDEMPOTENCY_REQUIRED,
         IDEMPOTENCY_CONFLICT, RATE_LIMITED, BUDGET_EXCEEDED,
         CONNECTOR_UNAVAILABLE,
         CONNECTOR_DISABLED, CONNECTOR_ROLLOUT_CHANGED, AUTH_REQUIRED,
         RIGHTS_BLOCKED, LEGAL_HOLD_ACTIVE, LEASE_LOST,
         POLICY_DRIFT, BROKER_CONFIG, SSRF_BLOCKED, NETWORK,
         PERMANENT_UNSUPPORTED, SCHEMA_CHANGED, PAYLOAD_LIMIT,
         REDIRECT_LIMIT, UPSTREAM_SECRET_REFLECTION, STORAGE_ERROR]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string, minLength: 1, maxLength: 1000 }
        errorCode: { $ref: '#/components/schemas/SourceErrorCode' }
        issues:
          type: array
          maxItems: 100
          items:
            oneOf:
              - { type: string, maxLength: 1000 }
              - { type: object }
        retryable: { type: boolean }
        retryAfterSeconds: { type: integer, minimum: 0, maximum: 86400 }
    SourceErrorEnvelope:
      type: object
      additionalProperties: false
