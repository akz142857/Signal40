        row: { type: integer, minimum: 1 }
        sourceId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        reason: { type: string, enum: [already_exists] }
    SourceImportCommitResult:
      type: object
      additionalProperties: false
      required: [created, skipped]
      properties:
        created:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SourceImportCreatedItem' }
        skipped:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SourceImportSkippedItem' }
    SourceTestQueueResult:
      type: object
      additionalProperties: false
      required: [testId, testStatus, created]
      properties:
        testId: { type: string, minLength: 1 }
        testStatus: { type: string, enum: [queued, running, succeeded, failed] }
        created: { type: boolean }
    PublicSourcePreviewItem:
      type: object
      additionalProperties: false
      required: [title, url, publishedAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        url: { type: string, format: uri, maxLength: 2000 }
        publishedAt: { type: string, format: date-time }
        author: { type: string, minLength: 1, maxLength: 200 }
        summary: { type: string, minLength: 1, maxLength: 2000 }
    PublicSourceTestCapabilities:
