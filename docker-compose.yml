# 本地开发依赖：只有 PostgreSQL。
#
# 对象存储用 Cloudflare R2（S3 兼容端点），不在本地跑替身——
# 分片上传、元数据、校验和这些行为差异，用替身测出来的结论不作数。
# 已经有自己的 PostgreSQL 就不用起这个服务，改 .env 里的 DATABASE_URL 即可。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal40
      POSTGRES_PASSWORD: signal40
      POSTGRES_DB: signal40
    # 用非默认宿主端口，避免和开发机上已有的 PostgreSQL 抢 5432。
    ports: ['55432:5432']
    volumes: ['signal40-pg:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U signal40 -d signal40']
      interval: 2s
      timeout: 3s
      retries: 30

  # 控制面、Render Worker、调度器都是常驻服务：Worker 不再由人手动 `npm run worker`，
  # 调度器也不是控制面里的 setInterval（vinext 没有 startup 钩子，见 lib/orchestrator.ts 注释）。
  # 本文件是本地开发编排；生产请使用独立部署清单与 secret 注入。
  control-plane:
    build: .
    environment:
      DATABASE_URL: postgres://signal40:signal40@postgres:5432/signal40
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_CHECKSUM_MODE: ${S3_CHECKSUM_MODE:-WHEN_REQUIRED}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:-}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SIGNAL40_SOURCE_WORKER_TOKEN: ${SIGNAL40_SOURCE_WORKER_TOKEN:-${SIGNAL40_WORKER_TOKEN:-local-development}}
      SIGNAL40_RENDER_WORKER_TOKEN: ${SIGNAL40_RENDER_WORKER_TOKEN:-${SIGNAL40_WORKER_TOKEN:-local-development}}
      SIGNAL40_AUTOMATION_ACTOR_ID: ${SIGNAL40_AUTOMATION_ACTOR_ID:-}
      SIGNAL40_IDENTITY_HEADER_ID: ${SIGNAL40_IDENTITY_HEADER_ID:-oai-authenticated-user-id}
      SIGNAL40_IDENTITY_HEADER_EMAIL: ${SIGNAL40_IDENTITY_HEADER_EMAIL:-oai-authenticated-user-email}
      SIGNAL40_ALLOW_LOCAL_ROLE_HEADERS: ${SIGNAL40_ALLOW_LOCAL_ROLE_HEADERS:-true}
      RENDER_CONCURRENCY_LIMIT: ${RENDER_CONCURRENCY_LIMIT:-2}
      MONTHLY_RENDER_BUDGET_MICROS: ${MONTHLY_RENDER_BUDGET_MICROS:-0}
      SIGNAL40_DEPLOYMENT_MODE: development
      PORT: 3000
    ports: ['3000:3000']
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  render-worker:
    build:
      context: .
      dockerfile: render-worker/Dockerfile
    environment:
      SIGNAL40_CONTROL_URL: http://control-plane:3000
      SIGNAL40_WORKER_PROFILE: render
      SIGNAL40_RENDER_WORKER_TOKEN: ${SIGNAL40_RENDER_WORKER_TOKEN:-${SIGNAL40_WORKER_TOKEN:-local-development}}
      SIGNAL40_RENDER_WORKER_ID: ${SIGNAL40_RENDER_WORKER_ID:-render-worker-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-coral}
      YOUTUBE_ACCESS_TOKEN: ${YOUTUBE_ACCESS_TOKEN:-}
      SIGNAL40_ALLOW_PUBLIC_PUBLISH: ${SIGNAL40_ALLOW_PUBLIC_PUBLISH:-false}
      SIGNAL40_DEPLOYMENT_MODE: development
    depends_on: [control-plane]
    restart: unless-stopped
    # Chromium 渲染很吃内存；不设上限时一次失控的渲染会把宿主拖垮。
    mem_limit: 4g
    shm_size: 1g

  source-worker:
    build:
      context: .
      dockerfile: source-worker/Dockerfile
    # 来源 Worker 不读取整份 .env，因此拿不到 OpenAI、YouTube 或对象存储长期凭据。
    environment:
      SIGNAL40_CONTROL_URL: http://control-plane:3000
      SIGNAL40_WORKER_PROFILE: source
      SIGNAL40_SOURCE_WORKER_TOKEN: ${SIGNAL40_SOURCE_WORKER_TOKEN:-${SIGNAL40_WORKER_TOKEN:-local-development}}
      SIGNAL40_SOURCE_WORKER_ID: ${SIGNAL40_SOURCE_WORKER_ID:-source-worker-1}
      SIGNAL40_DEPLOYMENT_MODE: development
    depends_on: [control-plane]
    restart: unless-stopped
    mem_limit: 512m

  scheduler:
    build: .
    environment:
      DATABASE_URL: postgres://signal40:signal40@postgres:5432/signal40
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-5000}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_CHECKSUM_MODE: ${S3_CHECKSUM_MODE:-WHEN_REQUIRED}
      SIGNAL40_AUTOMATION_ACTOR_ID: ${SIGNAL40_AUTOMATION_ACTOR_ID:-}
      SIGNAL40_SCHEDULER_INTERVAL_MS: ${SIGNAL40_SCHEDULER_INTERVAL_MS:-30000}
      SIGNAL40_ATTENTION_WEBHOOK_URL: ${SIGNAL40_ATTENTION_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      MONTHLY_RENDER_BUDGET_MICROS: ${MONTHLY_RENDER_BUDGET_MICROS:-0}
      SIGNAL40_DEPLOYMENT_MODE: development
    command: ['npm', 'run', 'scheduler']
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  signal40-pg:
